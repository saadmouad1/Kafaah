    <rect x="204" y="232" width="52" height="150" rx="20" fill="#ffffff" opacity="0.96"/>
    <rect x="276" y="176" width="52" height="206" rx="20" fill="#ffffff"/>
  </g>
  <!-- علامة صح ذهبية -->
  <path d="M150 168 L214 236 L372 96" fill="none" stroke="url(#gold)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="384" cy="384" r="34" fill="url(#gold)"/>
